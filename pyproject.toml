[project]
name = "mtask"
version = "0.1.0"
description = "Simple spreadsheet-backed task manager CLI (gspread). LLM-friendly."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "gspread>=6.0",
    "google-auth-oauthlib>=1.2",
    "tomli-w>=1.0",
]

[project.scripts]
mtask = "mtask.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtask"]
